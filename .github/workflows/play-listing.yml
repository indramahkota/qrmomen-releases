# Syncs Google Play store listing text and graphical assets via indramahkota/qrmomen.
name: Google Play listing

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag or commit of qrmomen
        required: true
        default: main
      update_metadata:
        description: Update localized title, short description and full description
        type: boolean
        default: true
      update_images:
        description: Update app icon and localized feature graphics
        type: boolean
        default: true
      update_screenshots:
        description: Update phone, 7-inch tablet and 10-inch screenshots
        type: boolean
        default: true
      changes_not_sent_for_review:
        description: Save changes as pending in Play Console instead of sending for review
        type: boolean
        default: true
      validate_only:
        description: Validate changes against Google Play API without committing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  listing:
    name: Sync Google Play listing
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          repository: indramahkota/qrmomen
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: qrmomen-source

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Sync listing to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPDATE_METADATA: ${{ inputs.update_metadata }}
          UPDATE_IMAGES: ${{ inputs.update_images }}
          UPDATE_SCREENSHOTS: ${{ inputs.update_screenshots }}
          CHANGES_NOT_SENT_FOR_REVIEW: ${{ inputs.changes_not_sent_for_review }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: qrmomen-source/scripts/play-listing.sh
